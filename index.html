<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arch Tiers</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #08090d;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #0d1016;
            border-bottom: 1px solid #242a35;
            padding: 28px 20px;
            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .logo span {
            color: #55ff55;
        }

        .subtitle {
            color: #7f8999;
            margin-top: 8px;
            font-size: 14px;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            background: #0a0d12;
            border-bottom: 1px solid #202631;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;
            padding: 14px;

            flex-wrap: wrap;
        }

        nav button {
            border: 1px solid #303744;
            background: #151922;
            color: #bfc6d1;

            padding: 10px 20px;

            border-radius: 7px;

            font-weight: 700;
            cursor: pointer;

            transition: 0.15s;
        }

        nav button:hover {
            background: #1d2430;
            color: white;
        }

        nav button.active {
            background: #55ff55;
            color: #071007;
            border-color: #55ff55;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 95%;
            max-width: 1250px;
            margin: 30px auto;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .mode-title {
            font-size: 24px;
            font-weight: 800;
        }

        .mode-title span {
            color: #55ff55;
        }

        .search {
            background: #10141b;
            border: 1px solid #2a313d;
            color: white;

            padding: 11px 14px;

            border-radius: 7px;

            outline: none;

            width: 240px;
        }

        .search:focus {
            border-color: #55ff55;
        }


        /* =========================
           TIER ROW
        ========================= */

        .tier-row {
            display: grid;

            grid-template-columns: 105px 1fr;

            min-height: 70px;

            margin-bottom: 7px;

            background: #10141b;

            border: 1px solid #252c37;

            border-radius: 7px;

            overflow: hidden;
        }

        .tier-name {
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 900;
        }


        /* =========================
           TIER COLORS
        ========================= */

        .HT1 {
            background: #ff3b3b;
        }

        .LT1 {
            background: #ff6767;
        }

        .HT2 {
            background: #ff9438;
        }

        .LT2 {
            background: #ffb25e;
        }

        .HT3 {
            background: #f0cf3e;
            color: #151515;
        }

        .LT3 {
            background: #f5e36c;
            color: #151515;
        }

        .HT4 {
            background: #42c979;
        }

        .LT4 {
            background: #68dc97;
        }

        .HT5 {
            background: #459be9;
        }

        .LT5 {
            background: #71b5ef;
        }


        /* =========================
           PLAYERS AREA
        ========================= */

        .players {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            padding: 10px;
        }


        /* =========================
           PLAYER CARD
        ========================= */

        .player {
            display: flex;
            align-items: center;

            gap: 7px;

            background: #191e27;

            border: 1px solid #303744;

            border-radius: 7px;

            padding: 7px 9px;

            font-weight: 700;

            transition: 0.15s;
        }

        .player:hover {
            border-color: #4a5566;
            background: #1d232e;
        }

        .player-name {
            cursor: pointer;
            color: #ffffff;
        }

        .player-name:hover {
            color: #55ff55;
        }


        /* =========================
           PLAYER BUTTONS
        ========================= */

        .player button {
            border: none;

            width: 23px;
            height: 23px;

            border-radius: 5px;

            color: white;

            font-weight: 900;

            cursor: pointer;
        }

        .up {
            background: #29924c;
        }

        .down {
            background: #a63c3c;
        }

        .delete {
            background: #4b515c;
        }

        .player button:hover {
            filter: brightness(1.25);
        }


        /* =========================
           EMPTY TIER
        ========================= */

        .empty {
            color: #555f6e;
            font-size: 13px;
            padding-left: 4px;
        }


        /* =========================
           ADD PLAYER
        ========================= */

        .add-box {
            margin-top: 25px;

            background: #10141b;

            border: 1px solid #252c37;

            border-radius: 9px;

            padding: 20px;
        }

        .add-box h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form input,
        .form select {
            background: #080b10;

            color: white;

            border: 1px solid #303744;

            border-radius: 6px;

            padding: 11px;

            outline: none;
        }

        .form input {
            flex: 1;
            min-width: 200px;
        }

        .form input:focus,
        .form select:focus {
            border-color: #55ff55;
        }

        .add-button {
            background: #55ff55;

            color: #061006;

            border: none;

            border-radius: 6px;

            padding: 11px 18px;

            font-weight: 800;

            cursor: pointer;
        }

        .add-button:hover {
            background: #78ff78;
        }


        /* =========================
           PROFILE MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.82);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 999;
        }

        .modal.show {
            display: flex;
        }

        .profile {
            width: 100%;
            max-width: 520px;

            background: #10141b;

            border: 1px solid #303744;

            border-radius: 12px;

            padding: 25px;

            position: relative;

            box-shadow:
                0 20px 70px rgba(0,0,0,0.7);
        }


        /* CLOSE */

        .close {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 7px;

            background: #252b35;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .close:hover {
            background: #ef4444;
        }


        /* PROFILE HEADER */

        .profile-header {
            text-align: center;

            padding-bottom: 20px;

            border-bottom: 1px solid #272e39;
        }

        .skin {
            width: 100px;
            height: 100px;

            image-rendering: pixelated;

            border-radius: 10px;

            border: 3px solid #55ff55;

            background: #080b10;
        }

        .profile-name {
            margin: 12px 0 5px;

            font-size: 27px;

            font-weight: 900;
        }

        .profile-subtitle {
            color: #7f8999;

            font-size: 13px;
        }


        /* =========================
           PROFILE RANKINGS
        ========================= */

        .rankings {
            margin-top: 20px;

            display: grid;

            gap: 8px;
        }

        .ranking {
            display: flex;

            justify-content: space-between;

            align-items: center;

            background: #191e27;

            border: 1px solid #303744;

            padding: 12px;

            border-radius: 7px;
        }

        .ranking-mode {
            font-weight: 700;
        }

        .ranking-tier {
            padding: 6px 12px;

            border-radius: 5px;

            font-weight: 900;
        }

        .unranked {
            color: #667080;
            font-weight: 700;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 650px) {

            .logo {
                font-size: 30px;
            }

            .tier-row {
                grid-template-columns: 70px 1fr;
            }

            .tier-name {
                font-size: 14px;
            }

            .search {
                width: 100%;
            }

            .top-bar {
                align-items: stretch;
            }

            .form {
                flex-direction: column;
            }

            .form input,
            .form select,
            .add-button {
                width: 100%;
            }

        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        ARCH <span>TIERS</span>
    </div>

    <div class="subtitle">
        Minecraft PvP Tier Rankings
    </div>

</header>


<!-- =========================
     MODES
========================= -->

<nav>

    <button
        id="BedfightBtn"
        class="active"
        onclick="changeMode('Bedfight')">
        Bedfight
    </button>

    <button
        id="BedwarsBtn"
        onclick="changeMode('Bedwars')">
        Bedwars
    </button>

    <button
        id="UHCBtn"
        onclick="changeMode('UHC')">
        UHC
    </button>

    <button
        id="SumoBtn"
        onclick="changeMode('Sumo')">
        Sumo
    </button>

</nav>


<!-- =========================
     MAIN
========================= -->

<main>


    <div class="top-bar">

        <div class="mode-title">
            <span>ARCH</span> TIERS —
            <span id="currentMode">Bedfight</span>
        </div>

        <input
            class="search"
            id="search"
            type="text"
            placeholder="Search player..."
            oninput="render()">

    </div>


    <!-- TIER LIST -->

    <div id="tierList"></div>


    <!-- =========================
         ADD PLAYER
    ========================= -->

    <div class="add-box">

        <h2>Add Player</h2>

        <div class="form">

            <input
                id="playerName"
                type="text"
                placeholder="Minecraft username">

            <select id="playerTier">

                <option value="HT1">HT1</option>
                <option value="LT1">LT1</option>

                <option value="HT2">HT2</option>
                <option value="LT2">LT2</option>

                <option value="HT3">HT3</option>
                <option value="LT3">LT3</option>

                <option value="HT4">HT4</option>
                <option value="LT4">LT4</option>

                <option value="HT5">HT5</option>
                <option value="LT5">LT5</option>

            </select>

            <button
                class="add-button"
                onclick="addPlayer()">
                Add Player
            </button>

        </div>

    </div>

</main>


<!-- =========================
     PLAYER PROFILE
========================= -->

<div
    class="modal"
    id="profileModal"
    onclick="outsideClose(event)">

    <div class="profile">

        <button
            class="close"
            onclick="closeProfile()">
            ×
        </button>


        <div class="profile-header">

            <img
                id="skin"
                class="skin"
                src=""
                alt="Minecraft Player">

            <div
                class="profile-name"
                id="profileName">
                Player
            </div>

            <div class="profile-subtitle">
                Arch Tiers Player Profile
            </div>

        </div>


        <div
            class="rankings"
            id="rankings">
        </div>

    </div>

</div>


<script>


/* =========================
   DATABASE
========================= */

/*
    ADD YOUR PLAYERS HERE.

    Example:

    "Steve": "HT1"

*/

let players = {

    Bedfight: {
        "ExamplePlayer": "HT1",
        "ExamplePlayer2": "LT2"
    },

    Bedwars: {
        "ExamplePlayer": "HT2"
    },

    UHC: {
        "ExamplePlayer": "HT3"
    },

    Sumo: {
        "ExamplePlayer": "LT1"
    }

};


/* =========================
   SETTINGS
========================= */

const tiers = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
];

const modes = [
    "Bedfight",
    "Bedwars",
    "UHC",
    "Sumo"
];

let currentMode = "Bedfight";


/* =========================
   SAVE
========================= */

function saveData() {

    localStorage.setItem(
        "archTiersData",
        JSON.stringify(players)
    );

}


/* =========================
   LOAD
========================= */

function loadData() {

    const saved =
        localStorage.getItem("archTiersData");

    if (saved) {

        try {

            players =
                JSON.parse(saved);

        } catch {

            console.log(
                "Could not load saved data."
            );

        }

    }

}


/* =========================
   CHANGE MODE
========================= */

function changeMode(mode) {

    currentMode = mode;

    document
        .querySelectorAll("nav button")
        .forEach(button => {

            button.classList.remove("active");

        });

    document
        .getElementById(mode + "Btn")
        .classList.add("active");

    document
        .getElementById("currentMode")
        .textContent = mode;

    render();

}


/* =========================
   RENDER
========================= */

function render() {

    const container =
        document.getElementById("tierList");

    container.innerHTML = "";

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    tiers.forEach(tier => {

        const row =
            document.createElement("div");

        row.className = "tier-row";


        const tierTitle =
            document.createElement("div");

        tierTitle.className =
            `tier-name ${tier}`;

        tierTitle.textContent = tier;


        const playersArea =
            document.createElement("div");

        playersArea.className = "players";


        let count = 0;


        for (
            const player
            in players[currentMode]
        ) {

            const playerTier =
                players[currentMode][player];


            if (playerTier !== tier) {
                continue;
            }


            if (
                search &&
                !player
                    .toLowerCase()
                    .includes(search)
            ) {

                continue;

            }


            count++;


            const playerBox =
                document.createElement("div");

            playerBox.className = "player";


            const name =
                document.createElement("span");

            name.className =
                "player-name";

            name.textContent =
                player;

            name.onclick = function() {

                openProfile(player);

            };


            const up =
                document.createElement("button");

            up.className = "up";

            up.textContent = "↑";

            up.onclick = function(event) {

                event.stopPropagation();

                movePlayer(player, -1);

            };


            const down =
                document.createElement("button");

            down.className = "down";

            down.textContent = "↓";

            down.onclick = function(event) {

                event.stopPropagation();

                movePlayer(player, 1);

            };


            const remove =
                document.createElement("button");

            remove.className = "delete";

            remove.textContent = "×";

            remove.onclick = function(event) {

                event.stopPropagation();

                deletePlayer(player);

            };


            playerBox.appendChild(name);

            playerBox.appendChild(up);

            playerBox.appendChild(down);

            playerBox.appendChild(remove);

            playersArea.appendChild(playerBox);

        }


        if (count === 0) {

            const empty =
                document.createElement("span");

            empty.className = "empty";

            empty.textContent =
                "No players";

            playersArea.appendChild(empty);

        }


        row.appendChild(tierTitle);

        row.appendChild(playersArea);

        container.appendChild(row);

    });

}


/* =========================
   MOVE PLAYER
========================= */

function movePlayer(player, direction) {

    const currentTier =
        players[currentMode][player];

    const currentIndex =
        tiers.indexOf(currentTier);


    let newIndex =
        currentIndex + direction;


    if (newIndex < 0) {

        newIndex = 0;

    }


    if (newIndex >= tiers.length) {

        newIndex =
            tiers.length - 1;

    }


    players[currentMode][player] =
        tiers[newIndex];


    saveData();

    render();

}


/* =========================
   DELETE PLAYER
========================= */

function deletePlayer(player) {

    const confirmed =
        confirm(
            `Remove ${player} from ${currentMode}?`
        );


    if (!confirmed) {
        return;
    }


    delete players[currentMode][player];

    saveData();

    render();

}


/* =========================
   ADD PLAYER
========================= */

function addPlayer() {

    const input =
        document.getElementById(
            "playerName"
        );

    const tier =
        document.getElementById(
            "playerTier"
        ).value;


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter a Minecraft username."
        );

        return;

    }


    players[currentMode][name] =
        tier;


    input.value = "";


    saveData();

    render();

}


/* =========================
   OPEN PROFILE
========================= */

function openProfile(player) {

    document
        .getElementById("profileName")
        .textContent = player;


    /*
       Minecraft player head.
    */

    document
        .getElementById("skin")
        .src =
        "https://mc-heads.net/avatar/" +
        encodeURIComponent(player) +
        "/100";


    const rankings =
        document.getElementById(
            "rankings"
        );


    rankings.innerHTML = "";


    modes.forEach(mode => {

        const tier =
            players[mode][player];


        const row =
            document.createElement("div");

        row.className =
            "ranking";


        const modeName =
            document.createElement("span");

        modeName.className =
            "ranking-mode";

        modeName.textContent =
            mode;


        if (tier) {

            const tierBox =
                document.createElement("span");

            tierBox.className =
                `ranking-tier ${tier}`;

            tierBox.textContent =
                tier;

            row.appendChild(modeName);

            row.appendChild(tierBox);

        } else {

            const unranked =
                document.createElement("span");

            unranked.className =
                "unranked";

            unranked.textContent =
                "Unranked";

            row.appendChild(modeName);

            row.appendChild(unranked);

        }


        rankings.appendChild(row);

    });


    document
        .getElementById("profileModal")
        .classList.add("show");

}


/* =========================
   CLOSE PROFILE
========================= */

function closeProfile() {

    document
        .getElementById("profileModal")
        .classList.remove("show");

}


function outsideClose(event) {

    if (
        event.target.id ===
        "profileModal"
    ) {

        closeProfile();

    }

}


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeProfile();

        }

    }
);


/* =========================
   START
========================= */

loadData();

render();

</script>

</body>
</html>
