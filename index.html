<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arch Tiers</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 0%, rgba(45,255,120,.08), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(50,120,255,.06), transparent 30%),
        #05070a;
    color: #f4f7fb;
    font-family: Inter, Arial, Helvetica, sans-serif;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #07090d;
}

::-webkit-scrollbar-thumb {
    background: #26302b;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #39ff78;
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );
    background-size: 40px 40px;
    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}

/* =========================================================
   HEADER
========================================================= */

header {
    position: relative;
    padding: 55px 20px 42px;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background:
        linear-gradient(
            180deg,
            rgba(15,20,26,.95),
            rgba(5,7,10,.75)
        );
}

header::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 180px;
    left: 50%;
    top: -100px;
    transform: translateX(-50%);
    background: #39ff78;
    filter: blur(120px);
    opacity: .12;
}

.logo {
    position: relative;
    font-size: clamp(38px, 7vw, 70px);
    line-height: 1;
    font-weight: 1000;
    letter-spacing: -3px;
    text-transform: uppercase;
    text-shadow:
        0 0 20px rgba(57,255,120,.12);
}

.logo .arch {
    color: #ffffff;
}

.logo .tiers {
    color: #39ff78;
    text-shadow:
        0 0 25px rgba(57,255,120,.35);
}

.subtitle {
    position: relative;
    margin-top: 14px;
    color: #7e8997;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* =========================================================
   NAVIGATION
========================================================= */

nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 13px 15px;
    background: rgba(7,10,14,.86);
    border-bottom: 1px solid rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
}

nav button {
    position: relative;
    border: 1px solid #252d37;
    background: #10151b;
    color: #87919f;
    border-radius: 9px;
    padding: 10px 17px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    transition: .2s ease;
}

nav button:hover {
    color: white;
    border-color: #39434f;
    background: #151b23;
    transform: translateY(-1px);
}

nav button.active {
    color: #041009;
    background: #39ff78;
    border-color: #39ff78;
    box-shadow:
        0 0 20px rgba(57,255,120,.15);
}

/* =========================================================
   MAIN
========================================================= */

main {
    position: relative;
    width: min(1200px, 94%);
    margin: 34px auto 70px;
}

/* =========================================================
   TOP BAR
========================================================= */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.title-area {
    display: flex;
    align-items: center;
    gap: 13px;
}

.title-icon {
    display: grid;
    place-items: center;
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background:
        linear-gradient(
            135deg,
            rgba(57,255,120,.2),
            rgba(57,255,120,.04)
        );
    border: 1px solid rgba(57,255,120,.25);
    box-shadow:
        inset 0 0 20px rgba(57,255,120,.04);
    font-size: 22px;
}

.title {
    font-size: 22px;
    font-weight: 950;
}

.title .green {
    color: #39ff78;
}

.mode-label {
    color: #717c8b;
    font-size: 12px;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrapper {
    position: relative;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #687381;
    pointer-events: none;
}

.search {
    width: 260px;
    padding: 12px 14px 12px 40px;
    border-radius: 10px;
    border: 1px solid #252d37;
    outline: none;
    background: #0c1117;
    color: white;
    transition: .2s ease;
}

.search::placeholder {
    color: #596370;
}

.search:focus {
    border-color: rgba(57,255,120,.5);
    box-shadow:
        0 0 0 3px rgba(57,255,120,.06);
}

/* =========================================================
   TIER LIST
========================================================= */

.tier-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.tier {
    position: relative;
    display: grid;
    grid-template-columns: 105px 1fr;
    min-height: 76px;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.065);
    background:
        linear-gradient(
            110deg,
            rgba(18,23,30,.98),
            rgba(11,15,20,.98)
        );
    box-shadow:
        0 8px 25px rgba(0,0,0,.15);
    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.tier:hover {
    transform: translateX(3px);
    border-color: rgba(255,255,255,.12);
    box-shadow:
        0 12px 35px rgba(0,0,0,.22);
}

.tier::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.015),
            transparent 35%
        );
}

.tier-name {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 3px;
    color: #fff;
    font-size: 17px;
    font-weight: 1000;
    letter-spacing: .5px;
    text-shadow:
        0 2px 8px rgba(0,0,0,.4);
}

.tier-name small {
    font-size: 8px;
    opacity: .65;
    letter-spacing: 1.5px;
}

/* =========================================================
   TIER COLORS
========================================================= */

.HT1 {
    background:
        linear-gradient(
            135deg,
            #ff3434,
            #a90e22
        );
}

.LT1 {
    background:
        linear-gradient(
            135deg,
            #ff5d5d,
            #bd2535
        );
}

.HT2 {
    background:
        linear-gradient(
            135deg,
            #ff9a38,
            #c95c12
        );
}

.LT2 {
    background:
        linear-gradient(
            135deg,
            #ffb85a,
            #d47c1f
        );
}

.HT3 {
    color: #151006;
    background:
        linear-gradient(
            135deg,
            #f4d33f,
            #b99a19
        );
}

.LT3 {
    color: #151006;
    background:
        linear-gradient(
            135deg,
            #f5e276,
            #c7b543
        );
}

.HT4 {
    background:
        linear-gradient(
            135deg,
            #3bd87c,
            #19884d
        );
}

.LT4 {
    background:
        linear-gradient(
            135deg,
            #63e99a,
            #26965d
        );
}

.HT5 {
    background:
        linear-gradient(
            135deg,
            #419fee,
            #2166a9
        );
}

.LT5 {
    background:
        linear-gradient(
            135deg,
            #69b7f4,
            #347db8
        );
}

/* =========================================================
   PLAYERS
========================================================= */

.players {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    align-content: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 76px;
    padding: 11px 13px;
}

.player {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 43px;
    padding: 5px 8px 5px 5px;
    border-radius: 9px;
    border: 1px solid #29313c;
    background:
        linear-gradient(
            135deg,
            #1a212a,
            #11161d
        );
    box-shadow:
        0 4px 12px rgba(0,0,0,.18);
    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    animation: playerIn .25s ease both;
}

@keyframes playerIn {
    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.player:hover {
    transform: translateY(-2px);
    border-color: rgba(57,255,120,.35);
    box-shadow:
        0 7px 20px rgba(0,0,0,.28),
        0 0 16px rgba(57,255,120,.04);
}

.player-head {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    image-rendering: pixelated;
    background: #080b0f;
    border: 1px solid #39434f;
}

.player-name {
    color: #e9edf2;
    font-size: 13px;
    font-weight: 850;
    cursor: pointer;
    white-space: nowrap;
}

.player-name:hover {
    color: #39ff78;
}

.empty {
    color: #4f5966;
    font-size: 12px;
    padding-left: 3px;
}

/* =========================================================
   MODALS
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(10px);
}

.modal.show {
    display: flex;
}

.card {
    position: relative;
    width: min(760px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 27px;
    border: 1px solid #2b343f;
    border-radius: 16px;
    background:
        radial-gradient(
            circle at top right,
            rgba(57,255,120,.05),
            transparent 35%
        ),
        #0d1218;
    box-shadow:
        0 30px 80px rgba(0,0,0,.6);
    animation: modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.close {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 35px;
    height: 35px;
    border: 1px solid #303945;
    border-radius: 8px;
    background: #171d25;
    color: #aeb6c1;
    font-size: 20px;
    cursor: pointer;
}

.close:hover {
    color: white;
    background: #232b35;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-head {
    text-align: center;
    padding: 10px 0 24px;
    border-bottom: 1px solid #252d37;
}

.skin {
    width: 105px;
    height: 105px;
    image-rendering: pixelated;
    border-radius: 13px;
    border: 2px solid #39ff78;
    box-shadow:
        0 0 25px rgba(57,255,120,.14);
}

.profile-name {
    margin-top: 13px;
    font-size: 28px;
    font-weight: 1000;
}

.status {
    margin-top: 7px;
    font-size: 13px;
    font-weight: 800;
}

.profile-section {
    margin-top: 24px;
}

.profile-section h3 {
    margin-bottom: 10px;
    color: #39ff78;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.rank {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 7px;
    padding: 12px 14px;
    border: 1px solid #252d37;
    border-radius: 9px;
    background: #141a21;
}

.history {
    margin-bottom: 7px;
    padding: 12px 14px;
    border: 1px solid #252d37;
    border-radius: 9px;
    background: #141a21;
    color: #aab3bf;
    line-height: 1.5;
}

.muted {
    color: #687381;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 25px;
    text-align: center;
    color: #46505d;
    border-top: 1px solid rgba(255,255,255,.05);
    font-size: 12px;
}

footer strong {
    color: #39ff78;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    header {
        padding: 40px 15px 30px;
    }

    .logo {
        letter-spacing: -2px;
    }

    nav {
        position: relative;
    }

    nav button {
        padding: 9px 12px;
        font-size: 12px;
    }

    main {
        width: 95%;
        margin-top: 25px;
    }

    .search {
        width: 100%;
    }

    .top {
        align-items: stretch;
    }

    .search-wrapper {
        width: 100%;
    }

    .tier {
        grid-template-columns: 68px 1fr;
    }

    .tier-name {
        font-size: 13px;
    }

    .tier-name small {
        font-size: 7px;
    }

    .players {
        padding: 8px;
        min-height: 68px;
    }

    .player {
        min-height: 39px;
    }

    .player-head {
        width: 29px;
        height: 29px;
    }

    .player-name {
        font-size: 12px;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span class="arch">ARCH</span>
        <span class="tiers"> TIERS</span>
    </div>

    <div class="subtitle">
        Minecraft PvP Competitive Rankings
    </div>

</header>

<nav>

    <button
        id="BedfightBtn"
        class="active"
        onclick="changeMode('Bedfight')">
        ⚔ Bedfight
    </button>

    <button
        id="BedwarsBtn"
        onclick="changeMode('Bedwars')">
        🛏 Bedwars
    </button>

    <button
        id="UHCBtn"
        onclick="changeMode('UHC')">
        💎 UHC
    </button>

    <button
        id="SumoBtn"
        onclick="changeMode('Sumo')">
        🥊 Sumo
    </button>

</nav>

<main>

    <div class="top">

        <div class="title-area">

            <div class="title-icon">
                🏆
            </div>

            <div>

                <div class="title">
                    <span class="green">ARCH</span>
                    TIERS
                </div>

                <div
                    class="mode-label"
                    id="modeTitle">
                    Bedfight Rankings
                </div>

            </div>

        </div>

        <div class="search-wrapper">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                class="search"
                placeholder="Search player..."
                oninput="render()">

        </div>

    </div>

    <div
        id="tierList"
        class="tier-list">
    </div>

</main>

<!-- PLAYER PROFILE -->

<div
    class="modal"
    id="profileModal"
    onclick="outside(event,'profileModal')">

    <div class="card">

        <button
            class="close"
            onclick="closeModal('profileModal')">
            ×
        </button>

        <div class="profile-head">

            <img
                id="profileSkin"
                class="skin"
                alt="Minecraft Skin">

            <div
                id="profileName"
                class="profile-name">
            </div>

            <div
                id="profileStatus"
                class="status">
            </div>

        </div>

        <div class="profile-section">

            <h3>
                🏆 Rankings
            </h3>

            <div id="profileRanks"></div>

        </div>

        <div class="profile-section">

            <h3>
                📊 Statistics
            </h3>

            <div id="profileStats"></div>

        </div>

        <div class="profile-section">

            <h3>
                📝 Testing Information
            </h3>

            <div id="profileTesting"></div>

        </div>

        <div class="profile-section">

            <h3>
                📜 Tier History
            </h3>

            <div id="profileHistory"></div>

        </div>

    </div>

</div>

<footer>

    <strong>ARCH TIERS</strong>
    · Minecraft PvP Rankings

</footer>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const tiers = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
];

const modes = [
    "Bedfight",
    "Bedwars",
    "UHC",
    "Sumo"
];

let currentMode = "Bedfight";

/* =========================================================
   MANUAL PLAYER DATABASE
   ADD/EDIT PLAYERS HERE
========================================================= */

const players = {

    Luminous: {

        ranked: true,

        rankings: {

            Bedfight: "HT3",

            Bedwars: "HT3",

            UHC: null,

            Sumo: null

        },

        stats: {

            wins: 10,

            losses: 0,

            tests: 0

        },

        testedDate: "8/12/2026",

        tester: "Head Tester",

        lastUpdate: "8/12/2026",

        history: []

    }

};

/* =========================================================
   CHANGE MODE
========================================================= */

function changeMode(mode) {

    currentMode = mode;

    document
        .querySelectorAll("nav button")
        .forEach(button => {

            button.classList.remove("active");

        });

    document
        .getElementById(mode + "Btn")
        .classList.add("active");

    document
        .getElementById("modeTitle")
        .textContent =
        mode + " Rankings";

    render();

}

/* =========================================================
   RENDER TIER LIST
========================================================= */

function render() {

    const container =
        document.getElementById("tierList");

    container.innerHTML = "";

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    tiers.forEach((tier, index) => {

        const row =
            document.createElement("div");

        row.className = "tier";

        const tierName =
            document.createElement("div");

        tierName.className =
            "tier-name " + tier;

        const tierLabel =
            document.createElement("strong");

        tierLabel.textContent = tier;

        const tierSmall =
            document.createElement("small");

        if (index === 0) {

            tierSmall.textContent = "ELITE";

        } else if (index <= 3) {

            tierSmall.textContent = "HIGH";

        } else if (index <= 6) {

            tierSmall.textContent = "MID";

        } else {

            tierSmall.textContent = "LOW";

        }

        tierName.appendChild(tierLabel);
        tierName.appendChild(tierSmall);

        const area =
            document.createElement("div");

        area.className = "players";

        let found = false;

        Object.keys(players).forEach(name => {

            const player =
                players[name];

            if (
                player.rankings[currentMode] !== tier
            ) {
                return;
            }

            if (
                search &&
                !name.toLowerCase().includes(search)
            ) {
                return;
            }

            found = true;

            const box =
                document.createElement("div");

            box.className = "player";

            const head =
                document.createElement("img");

            head.className = "player-head";

            head.src =
                "https://mc-heads.net/avatar/" +
                encodeURIComponent(name) +
                "/64";

            head.alt =
                name + " Minecraft head";

            head.onerror =
                function() {

                    this.style.opacity = ".25";

                };

            const playerName =
                document.createElement("span");

            playerName.className =
                "player-name";

            playerName.textContent =
                name;

            playerName.onclick =
                () => openProfile(name);

            box.appendChild(head);
            box.appendChild(playerName);

            area.appendChild(box);

        });

        if (!found) {

            const empty =
                document.createElement("span");

            empty.className = "empty";

            empty.textContent =
                "No players in this tier";

            area.appendChild(empty);

        }

        row.appendChild(tierName);
        row.appendChild(area);

        container.appendChild(row);

    });

}

/* =========================================================
   PLAYER PROFILE
========================================================= */

function openProfile(name) {

    const player =
        players[name];

    if (!player)
        return;

    document
        .getElementById("profileName")
        .textContent =
        name;

    document
        .getElementById("profileSkin")
        .src =
        "https://mc-heads.net/avatar/" +
        encodeURIComponent(name) +
        "/100";

    const status =
        document.getElementById("profileStatus");

    status.textContent =
        player.ranked
            ? "● Ranked"
            : "● Unranked";

    status.style.color =
        player.ranked
            ? "#39ff78"
            : "#ff626b";

    /* RANKINGS */

    const ranks =
        document.getElementById("profileRanks");

    ranks.innerHTML = "";

    modes.forEach(mode => {

        const row =
            document.createElement("div");

        row.className = "rank";

        const left =
            document.createElement("span");

        left.textContent = mode;

        const right =
            document.createElement("span");

        const tier =
            player.rankings[mode];

        if (tier) {

            right.className =
                "tier-badge " + tier;

            right.textContent =
                tier;

            right.style.padding =
                "6px 13px";

            right.style.borderRadius =
                "6px";

            right.style.fontWeight =
                "950";

        } else {

            right.textContent =
                "Unranked";

            right.className =
                "muted";

        }

        row.appendChild(left);
        row.appendChild(right);

        ranks.appendChild(row);

    });

    /* STATS */

    const stats =
        player.stats || {};

    document
        .getElementById("profileStats")
        .innerHTML = `

            <div class="rank">
                <span>Wins</span>
                <b>
                    ${stats.wins || 0}
                </b>
            </div>

            <div class="rank">
                <span>Losses</span>
                <b>
                    ${stats.losses || 0}
                </b>
            </div>

            <div class="rank">
                <span>Tests</span>
                <b>
                    ${stats.tests || 0}
                </b>
            </div>

        `;

    /* TESTING INFORMATION */

    document
        .getElementById("profileTesting")
        .innerHTML = `

            <div class="rank">

                <span>
                    Tested
                </span>

                <b>
                    ${escapeHTML(
                        player.testedDate ||
                        "Unknown"
                    )}
                </b>

            </div>

            <div class="rank">

                <span>
                    Tester
                </span>

                <b>
                    ${escapeHTML(
                        player.tester ||
                        "Unknown"
                    )}
                </b>

            </div>

            <div class="rank">

                <span>
                    Last Update
                </span>

                <b>
                    ${escapeHTML(
                        player.lastUpdate ||
                        "Unknown"
                    )}
                </b>

            </div>

        `;

    /* TIER HISTORY */

    const history =
        document.getElementById(
            "profileHistory"
        );

    history.innerHTML = "";

    if (
        !player.history ||
        player.history.length === 0
    ) {

        history.innerHTML = `

            <div class="history">
                No tier changes yet.
            </div>

        `;

    } else {

        player.history.forEach(change => {

            const item =
                document.createElement(
                    "div"
                );

            item.className = "history";

            item.innerHTML = `

                <b>
                    ${escapeHTML(
                        change.mode
                    )}
                </b>

                <br>

                ${escapeHTML(
                    change.from
                )}

                →

                ${escapeHTML(
                    change.to
                )}

                <br>

                <small>
                    ${escapeHTML(
                        change.date
                    )}

                    ·

                    ${escapeHTML(
                        change.tester
                    )}
                </small>

            `;

            history.appendChild(item);

        });

    }

    document
        .getElementById("profileModal")
        .classList.add("show");

}

/* =========================================================
   MODALS
========================================================= */

function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");

}

function outside(event, id) {

    if (event.target.id === id) {

        closeModal(id);

    }

}

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

}

/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeModal("profileModal");

        }

    }
);

/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
