<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arch Tiers</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a0f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    background: #0d1118;
    border-bottom: 1px solid #252c37;
    padding: 25px;
    text-align: center;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #55ff55;
}

.subtitle {
    color: #7e8999;
    margin-top: 7px;
}

/* NAV */

nav {
    background: #0a0d12;
    border-bottom: 1px solid #222936;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;
    padding: 14px;

    flex-wrap: wrap;
}

nav button {
    background: #151a23;
    color: #c4cad4;

    border: 1px solid #303744;

    padding: 10px 18px;

    border-radius: 7px;

    font-weight: bold;

    cursor: pointer;
}

nav button:hover {
    background: #202732;
    color: white;
}

nav button.active {
    background: #55ff55;
    color: #061006;
    border-color: #55ff55;
}

/* MAIN */

main {
    width: 95%;
    max-width: 1250px;
    margin: 30px auto;
}

/* TOP BAR */

.top {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    flex-wrap: wrap;
}

.title {
    font-size: 24px;
    font-weight: 900;
}

.title span {
    color: #55ff55;
}

.search {
    background: #10151d;

    color: white;

    border: 1px solid #303744;

    border-radius: 7px;

    padding: 11px 14px;

    width: 250px;

    outline: none;
}

.search:focus {
    border-color: #55ff55;
}

/* TIERS */

.tier {
    display: grid;

    grid-template-columns: 105px 1fr;

    min-height: 70px;

    margin-bottom: 7px;

    background: #10151d;

    border: 1px solid #252c37;

    border-radius: 7px;

    overflow: hidden;
}

.tier-name {
    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    font-weight: 900;
}

/* COLORS */

.HT1 {
    background: #ff3b3b;
}

.LT1 {
    background: #ff6868;
}

.HT2 {
    background: #ff9638;
}

.LT2 {
    background: #ffb45f;
}

.HT3 {
    background: #f1d044;
    color: #111;
}

.LT3 {
    background: #f6e56f;
    color: #111;
}

.HT4 {
    background: #42c979;
}

.LT4 {
    background: #6bdd99;
}

.HT5 {
    background: #459be9;
}

.LT5 {
    background: #72b7ef;
}

/* PLAYERS */

.players {
    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    padding: 10px;
}

.player {
    display: flex;

    align-items: center;

    gap: 7px;

    background: #191f28;

    border: 1px solid #303744;

    border-radius: 7px;

    padding: 7px 9px;

    font-weight: bold;
}

.player-name {
    cursor: pointer;
}

.player-name:hover {
    color: #55ff55;
}

.player button {
    width: 23px;
    height: 23px;

    border: none;

    border-radius: 5px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.up {
    background: #2d994f;
}

.down {
    background: #a43e3e;
}

.delete {
    background: #515864;
}

/* ADD */

.add {
    background: #10151d;

    border: 1px solid #252c37;

    border-radius: 9px;

    padding: 20px;

    margin-top: 25px;
}

.add h2 {
    margin-top: 0;
}

.form {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.form input,
.form select {
    background: #080b10;

    color: white;

    border: 1px solid #303744;

    border-radius: 6px;

    padding: 11px;
}

.form input {
    flex: 1;
    min-width: 200px;
}

.add-btn {
    background: #55ff55;

    color: #061006;

    border: none;

    border-radius: 6px;

    padding: 11px 18px;

    font-weight: 900;

    cursor: pointer;
}

/* MODALS */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    background: rgba(0,0,0,.84);

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.card {
    width: 100%;
    max-width: 600px;

    max-height: 90vh;

    overflow-y: auto;

    background: #10151d;

    border: 1px solid #303744;

    border-radius: 12px;

    padding: 25px;

    position: relative;
}

.close {
    position: absolute;

    top: 15px;
    right: 15px;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 7px;

    background: #292f39;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.close:hover {
    background: #e43f3f;
}

/* PROFILE */

.profile-head {
    text-align: center;

    border-bottom: 1px solid #2a313c;

    padding-bottom: 20px;
}

.skin {
    width: 100px;
    height: 100px;

    image-rendering: pixelated;

    border: 3px solid #55ff55;

    border-radius: 10px;
}

.profile-name {
    font-size: 28px;

    font-weight: 900;

    margin-top: 10px;
}

.status {
    color: #55ff55;

    font-weight: bold;

    margin-top: 5px;
}

.profile-section {
    margin-top: 20px;
}

.profile-section h3 {
    color: #55ff55;
}

.rank {
    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #191f28;

    border: 1px solid #303744;

    padding: 12px;

    border-radius: 7px;

    margin-bottom: 7px;
}

.notes {
    background: #191f28;

    border: 1px solid #303744;

    padding: 12px;

    border-radius: 7px;

    color: #c4cad4;

    white-space: pre-wrap;
}

/* ADMIN */

.admin-login input,
.admin-login textarea,
.admin-login select {

    width: 100%;

    background: #080b10;

    color: white;

    border: 1px solid #303744;

    border-radius: 6px;

    padding: 11px;

    margin-bottom: 10px;

    outline: none;
}

.admin-btn {
    background: #55ff55;

    color: #061006;

    border: none;

    padding: 11px 18px;

    border-radius: 6px;

    font-weight: 900;

    cursor: pointer;
}

.logout {
    background: #d94141;

    color: white;

    border: none;

    padding: 9px 14px;

    border-radius: 6px;

    font-weight: bold;

    cursor: pointer;
}

.admin-panel {
    display: none;
}

.admin-panel.show {
    display: block;
}

.admin-row {
    background: #191f28;

    border: 1px solid #303744;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 8px;
}

.admin-row input,
.admin-row select,
.admin-row textarea {

    width: 100%;

    margin-top: 7px;

    background: #080b10;

    color: white;

    border: 1px solid #303744;

    border-radius: 6px;

    padding: 9px;
}

.history {
    background: #191f28;

    border: 1px solid #303744;

    border-radius: 7px;

    padding: 10px;

    margin-bottom: 7px;

    color: #bfc7d2;
}

/* MOBILE */

@media(max-width:650px) {

    .logo {
        font-size: 30px;
    }

    .tier {
        grid-template-columns: 70px 1fr;
    }

    .tier-name {
        font-size: 14px;
    }

    .search {
        width: 100%;
    }

    .form {
        flex-direction: column;
    }

    .form input,
    .form select,
    .add-btn {
        width: 100%;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        ARCH <span>TIERS</span>
    </div>

    <div class="subtitle">
        Minecraft PvP Tier Rankings
    </div>

</header>


<!-- NAV -->

<nav>

    <button
        id="BedfightBtn"
        class="active"
        onclick="changeMode('Bedfight')">
        Bedfight
    </button>

    <button
        id="BedwarsBtn"
        onclick="changeMode('Bedwars')">
        Bedwars
    </button>

    <button
        id="UHCBtn"
        onclick="changeMode('UHC')">
        UHC
    </button>

    <button
        id="SumoBtn"
        onclick="changeMode('Sumo')">
        Sumo
    </button>

    <button
        onclick="openAdmin()">
        Admin
    </button>

</nav>


<main>


    <!-- TOP -->

    <div class="top">

        <div class="title">

            <span>ARCH</span>
            TIERS —
            <span id="modeTitle">
                Bedfight
            </span>

        </div>

        <input
            class="search"
            id="search"
            placeholder="Search player..."
            oninput="render()">

    </div>


    <!-- TIER LIST -->

    <div id="tierList"></div>


    <!-- ADD PLAYER -->

    <div class="add">

        <h2>Add Player</h2>

        <div class="form">

            <input
                id="playerName"
                placeholder="Minecraft username">

            <select id="playerTier">

                <option>HT1</option>
                <option>LT1</option>

                <option>HT2</option>
                <option>LT2</option>

                <option>HT3</option>
                <option>LT3</option>

                <option>HT4</option>
                <option>LT4</option>

                <option>HT5</option>
                <option>LT5</option>

            </select>

            <button
                class="add-btn"
                onclick="addPlayer()">
                Add Player
            </button>

        </div>

    </div>

</main>


<!-- PROFILE -->

<div
    class="modal"
    id="profileModal"
    onclick="outsideClose(event)">

    <div class="card">

        <button
            class="close"
            onclick="closeModal('profileModal')">
            ×
        </button>

        <div class="profile-head">

            <img
                id="profileSkin"
                class="skin">

            <div
                class="profile-name"
                id="profileName">
                Player
            </div>

            <div
                class="status"
                id="profileStatus">
                Ranked
            </div>

        </div>


        <div class="profile-section">

            <h3>
                Rankings
            </h3>

            <div id="profileRanks"></div>

        </div>


        <div class="profile-section">

            <h3>
                Statistics
            </h3>

            <div id="profileStats"></div>

        </div>


        <div class="profile-section">

            <h3>
                Testing Information
            </h3>

            <div id="profileTesting"></div>

        </div>


        <div class="profile-section">

            <h3>
                Notes
            </h3>

            <div
                class="notes"
                id="profileNotes">
            </div>

        </div>


        <div class="profile-section">

            <h3>
                Tier History
            </h3>

            <div id="profileHistory"></div>

        </div>

    </div>

</div>


<!-- ADMIN -->

<div
    class="modal"
    id="adminModal"
    onclick="outsideAdmin(event)">

    <div class="card">

        <button
            class="close"
            onclick="closeModal('adminModal')">
            ×
        </button>


        <!-- LOGIN -->

        <div
            class="admin-login"
            id="adminLogin">

            <h2>
                Admin Login
            </h2>

            <p style="color:#7f8999;">
                Enter the admin password.
            </p>

            <input
                id="adminPassword"
                type="password"
                placeholder="Password">

            <button
                class="admin-btn"
                onclick="loginAdmin()">
                Login
            </button>

        </div>


        <!-- PANEL -->

        <div
            class="admin-panel"
            id="adminPanel">

            <h2>
                Admin Panel
            </h2>

            <button
                class="logout"
                onclick="logoutAdmin()">
                Logout
            </button>


            <div class="profile-section">

                <h3>
                    Edit Players
                </h3>

                <div id="adminPlayers"></div>

            </div>


            <div class="profile-section">

                <h3>
                    Tier Change History
                </h3>

                <div id="history"></div>

            </div>

        </div>

    </div>

</div>


<script>


/* ==========================================
   ARCH TIERS DATABASE
========================================== */

let players = {

    "ExamplePlayer": {

        ranked: true,

        rankings: {

            Bedfight: "HT1",
            Bedwars: "LT2",
            UHC: "HT3",
            Sumo: "LT1"

        },

        stats: {

            wins: 100,
            losses: 20,
            tests: 10

        },

        testedDate: "August 11, 2026",

        tester: "Arch",

        lastUpdate: "August 11, 2026",

        notes: "Example player.",

        history: []

    }

};


/* ==========================================
   SETTINGS
========================================== */

const modes = [
    "Bedfight",
    "Bedwars",
    "UHC",
    "Sumo"
];

const tiers = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
];

let currentMode = "Bedfight";

let adminLoggedIn = false;


/*
IMPORTANT:

This password is only for the
browser version.

It is NOT secure for a real
public admin system.
*/

const ADMIN_PASSWORD =
    "CHANGE_THIS_PASSWORD";


/* ==========================================
   SAVE
========================================== */

function saveData() {

    localStorage.setItem(
        "archTiersDatabase",
        JSON.stringify(players)
    );

}


/* ==========================================
   LOAD
========================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            "archTiersDatabase"
        );

    if (!saved) {
        return;
    }

    try {

        players =
            JSON.parse(saved);

    } catch {

        console.log(
            "Could not load database."
        );

    }

}


/* ==========================================
   MODE
========================================== */

function changeMode(mode) {

    currentMode = mode;

    document
        .querySelectorAll("nav button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            mode + "Btn"
        )
        .classList.add("active");


    document
        .getElementById(
            "modeTitle"
        )
        .textContent = mode;


    render();

}


/* ==========================================
   RENDER TIER LIST
========================================== */

function render() {

    const container =
        document.getElementById(
            "tierList"
        );

    container.innerHTML = "";


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    tiers.forEach(tier => {

        const row =
            document.createElement(
                "div"
            );

        row.className = "tier";


        const tierName =
            document.createElement(
                "div"
            );

        tierName.className =
            "tier-name " + tier;

        tierName.textContent =
            tier;


        const area =
            document.createElement(
                "div"
            );

        area.className =
            "players";


        let found = false;


        for (
            const name in players
        ) {

            const player =
                players[name];


            if (
                player.rankings[
                    currentMode
                ] !== tier
            ) {

                continue;

            }


            if (
                search &&
                !name
                    .toLowerCase()
                    .includes(search)
            ) {

                continue;

            }


            found = true;


            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "player";


            const playerName =
                document.createElement(
                    "span"
                );

            playerName.className =
                "player-name";

            playerName.textContent =
                name;

            playerName.onclick =
                () => openProfile(name);


            const up =
                document.createElement(
                    "button"
                );

            up.className = "up";

            up.textContent = "↑";

            up.onclick = () =>
                movePlayer(name, -1);


            const down =
                document.createElement(
                    "button"
                );

            down.className = "down";

            down.textContent = "↓";

            down.onclick = () =>
                movePlayer(name, 1);


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "delete";

            remove.textContent =
                "×";

            remove.onclick = () =>
                deletePlayer(name);


            box.appendChild(
                playerName
            );

            box.appendChild(up);

            box.appendChild(down);

            box.appendChild(remove);

            area.appendChild(box);

        }


        if (!found) {

            const empty =
                document.createElement(
                    "span"
                );

            empty.className =
                "empty";

            empty.textContent =
                "No players";

            area.appendChild(empty);

        }


        row.appendChild(
            tierName
        );

        row.appendChild(
            area
        );

        container.appendChild(
            row
        );

    });

}


/* ==========================================
   MOVE PLAYER
========================================== */

function movePlayer(
    name,
    direction
) {

    const player =
        players[name];


    const oldTier =
        player.rankings[
            currentMode
        ];


    if (!oldTier) {
        return;
    }


    const oldIndex =
        tiers.indexOf(oldTier);


    let newIndex =
        oldIndex + direction;


    if (newIndex < 0) {
        newIndex = 0;
    }


    if (
        newIndex >= tiers.length
    ) {

        newIndex =
            tiers.length - 1;

    }


    const newTier =
        tiers[newIndex];


    if (
        oldTier === newTier
    ) {

        return;

    }


    player.rankings[
        currentMode
    ] = newTier;


    player.lastUpdate =
        new Date().toLocaleDateString();


    player.history.unshift({

        mode: currentMode,

        from: oldTier,

        to: newTier,

        date:
            new Date()
                .toLocaleString(),

        tester:
            player.tester || "Admin"

    });


    saveData();

    render();

}


/* ==========================================
   ADD PLAYER
========================================== */

function addPlayer() {

    const input =
        document.getElementById(
            "playerName"
        );


    const name =
        input.value.trim();


    const tier =
        document.getElementById(
            "playerTier"
        ).value;


    if (!name) {

        alert(
            "Enter a Minecraft username."
        );

        return;

    }


    if (players[name]) {

        alert(
            "That player already exists."
        );

        return;

    }


    players[name] = {

        ranked: true,

        rankings: {

            Bedfight: null,
            Bedwars: null,
            UHC: null,
            Sumo: null

        },

        stats: {

            wins: 0,
            losses: 0,
            tests: 0

        },

        testedDate:
            new Date()
                .toLocaleDateString(),

        tester: "Admin",

        lastUpdate:
            new Date()
                .toLocaleDateString(),

        notes: "",

        history: []

    };


    players[name]
        .rankings[currentMode] =
        tier;


    input.value = "";


    saveData();

    render();

}


/* ==========================================
   DELETE PLAYER
========================================== */

function deletePlayer(name) {

    if (!adminLoggedIn) {

        alert(
            "Admin login required to delete players."
        );

        return;

    }


    if (
        !confirm(
            `Delete ${name}?`
        )
    ) {

        return;

    }


    delete players[name];

    saveData();

    render();

    renderAdmin();

}


/* ==========================================
   PROFILE
========================================== */

function openProfile(name) {

    const player =
        players[name];


    if (!player) {
        return;
    }


    document
        .getElementById(
            "profileName"
        )
        .textContent = name;


    document
        .getElementById(
            "profileSkin"
        )
        .src =
        "https://mc-heads.net/avatar/" +
        encodeURIComponent(name) +
        "/100";


    document
        .getElementById(
            "profileStatus"
        )
        .textContent =
        player.ranked
            ? "● Ranked"
            : "● Unranked";


    document
        .getElementById(
            "profileStatus"
        )
        .style.color =
        player.ranked
            ? "#55ff55"
            : "#ff6666";


    /* RANKINGS */

    const ranks =
        document.getElementById(
            "profileRanks"
        );

    ranks.innerHTML = "";


    modes.forEach(mode => {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "rank";


        const left =
            document.createElement(
                "span"
            );

        left.textContent =
            mode;


        const tier =
            player.rankings[mode];


        const right =
            document.createElement(
                "span"
            );


        if (tier) {

            right.className =
                "ranking-tier " +
                tier;

            right.textContent =
                tier;

        } else {

            right.textContent =
                "Unranked";

            right.style.color =
                "#667080";

        }


        row.appendChild(left);

        row.appendChild(right);

        ranks.appendChild(row);

    });


    /* STATS */

    const stats =
        player.stats || {};


    document
        .getElementById(
            "profileStats"
        )
        .innerHTML = `

        <div class="rank">
            <span>Wins</span>
            <b>${stats.wins || 0}</b>
        </div>

        <div class="rank">
            <span>Losses</span>
            <b>${stats.losses || 0}</b>
        </div>

        <div class="rank">
            <span>Tests</span>
            <b>${stats.tests || 0}</b>
        </div>

    `;


    /* TESTING */

    document
        .getElementById(
            "profileTesting"
        )
        .innerHTML = `

        <div class="rank">
            <span>Tested</span>
            <b>
                ${player.testedDate || "Unknown"}
            </b>
        </div>

        <div class="rank">
            <span>Tester</span>
            <b>
                ${player.tester || "Unknown"}
            </b>
        </div>

        <div class="rank">
            <span>Last Update</span>
            <b>
                ${player.lastUpdate || "Unknown"}
            </b>
        </div>

    `;


    /* NOTES */

    document
        .getElementById(
            "profileNotes"
        )
        .textContent =
        player.notes ||
        "No notes available.";


    /* HISTORY */

    const history =
        document.getElementById(
            "profileHistory"
        );


    history.innerHTML = "";


    if (
        !player.history ||
        player.history.length === 0
    ) {

        history.innerHTML =
            '<div class="history">No tier changes yet.</div>';

    } else {

        player.history.forEach(
            change => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "history";

                item.innerHTML = `

                    <b>
                        ${change.mode}
                    </b>

                    <br>

                    ${change.from}
                    →
                    ${change.to}

                    <br>

                    <small>
                        ${change.date}
                        ·
                        ${change.tester}
                    </small>

                `;

                history.appendChild(
                    item
                );

            }
        );

    }


    document
        .getElementById(
            "profileModal"
        )
        .classList.add("show");

}


/* ==========================================
   MODALS
========================================== */

function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");

}


function outsideClose(event) {

    if (
        event.target.id ===
        "profileModal"
    ) {

        closeModal(
            "profileModal"
        );

    }

}


function outsideAdmin(event) {

    if (
        event.target.id ===
        "adminModal"
    ) {

        closeModal(
            "adminModal"
        );

    }

}


/* ==========================================
   ADMIN
========================================== */

function openAdmin() {

    document
        .getElementById(
            "adminModal"
        )
        .classList.add("show");


    if (adminLoggedIn) {

        showAdmin();

    }

}


/* LOGIN */

function loginAdmin() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    if (
        password !==
        ADMIN_PASSWORD
    ) {

        alert(
            "Incorrect password."
        );

        return;

    }


    adminLoggedIn = true;


    showAdmin();

}


/* SHOW ADMIN */

function showAdmin() {

    document
        .getElementById(
            "adminLogin"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "adminPanel"
        )
        .classList.add("show");


    renderAdmin();

}


/* LOGOUT */

function logoutAdmin() {

    adminLoggedIn = false;


    document
        .getElementById(
            "adminLogin"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "adminPanel"
        )
        .classList.remove(
            "show"
        );


    document
        .getElementById(
            "adminPassword"
        )
        .value = "";

}


/* ADMIN PLAYER LIST */

function renderAdmin() {

    const container =
        document.getElementById(
            "adminPlayers"
        );


    container.innerHTML = "";


    for (
        const name in players
    ) {

        const player =
            players[name];


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "admin-row";


        row.innerHTML = `

            <b>${name}</b>

            <label>
                Bedfight
                <select
                    onchange="adminTier('${name}','Bedfight',this.value)">
                    ${tierOptions(
                        player.rankings.Bedfight
                    )}
                </select>
            </label>

            <label>
                Bedwars
                <select
                    onchange="adminTier('${name}','Bedwars',this.value)">
                    ${tierOptions(
                        player.rankings.Bedwars
                    )}
                </select>
            </label>

            <label>
                UHC
                <select
                    onchange="adminTier('${name}','UHC',this.value)">
                    ${tierOptions(
                        player.rankings.UHC
                    )}
                </select>
            </label>

            <label>
                Sumo
                <select
                    onchange="adminTier('${name}','Sumo',this.value)">
                    ${tierOptions(
                        player.rankings.Sumo
                    )}
                </select>
            </label>

            <label>
                Tester
                <input
                    value="${escapeHTML(
                        player.tester || ""
                    )}"
                    onchange="updateTester('${name}',this.value)">
            </label>

            <label>
                Notes
                <textarea
                    onchange="updateNotes('${name}',this.value)"
                    placeholder="Player notes...">${escapeHTML(
                        player.notes || ""
                    )}</textarea>
            </label>

            <button
                class="logout"
                onclick="deletePlayer('${name}')">
                Delete Player
            </button>

        `;


        container.appendChild(row);

    }


    renderHistory();

}


/* TIER OPTIONS */

function tierOptions(current) {

    let html =
        `<option value="">Unranked</option>`;


    tiers.forEach(tier => {

        html += `
            <option
                value="${tier}"
                ${current === tier ? "selected" : ""}>
                ${tier}
            </option>
        `;

    });


    return html;

}


/* ADMIN CHANGE TIER */

function adminTier(
    name,
    mode,
    newTier
) {

    const player =
        players[name];


    const oldTier =
        player.rankings[mode];


    if (oldTier === newTier) {
        return;
    }


    player.rankings[mode] =
        newTier || null;


    player.lastUpdate =
        new Date()
            .toLocaleDateString();


    player.history.unshift({

        mode: mode,

        from:
            oldTier || "Unranked",

        to:
            newTier || "Unranked",

        date:
            new Date()
                .toLocaleString(),

        tester:
            player.tester ||
            "Admin"

    });


    saveData();

    render();

    renderAdmin();

}


/* UPDATE TESTER */

function updateTester(
    name,
    value
) {

    players[name].tester =
        value;


    players[name].lastUpdate =
        new Date()
            .toLocaleDateString();


    saveData();

}


/* UPDATE NOTES */

function updateNotes(
    name,
    value
) {

    players[name].notes =
        value;


    players[name].lastUpdate =
        new Date()
            .toLocaleDateString();


    saveData();

}


/* HISTORY */

function renderHistory() {

    const container =
        document.getElementById(
            "history"
        );


    container.innerHTML = "";


    let count = 0;


    for (
        const name in players
    ) {

        const player =
            players[name];


        if (
            !player.history
        ) {

            continue;

        }


        player.history.forEach(
            change => {

                count++;


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "history";


                item.innerHTML = `

                    <b>${name}</b>

                    ·

                    ${change.mode}

                    <br>

                    ${change.from}
                    →
                    ${change.to}

                    <br>

                    <small>
                        ${change.date}
                        ·
                        ${change.tester}
                    </small>

                `;


                container.appendChild(
                    item
                );

            }
        );

    }


    if (count === 0) {

        container.innerHTML =
            '<div class="history">No history yet.</div>';

    }

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   START
========================================== */

loadData();

render();

</script>

</body>
</html>
