<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arch Tiers</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080a0f;
    color: white;
}

/* HEADER */

header {
    background: #10141c;
    border-bottom: 1px solid #252c38;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #55ff55;
    font-size: 38px;
    letter-spacing: 2px;
}

header p {
    margin: 8px 0 0;
    color: #8d97a8;
}

/* NAVIGATION */

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    background: #0c0f15;
    border-bottom: 1px solid #202630;
    flex-wrap: wrap;
}

nav button {
    background: #171c25;
    color: #ddd;
    border: 1px solid #303846;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

nav button:hover,
nav button.active {
    background: #55ff55;
    color: #071007;
}

/* MAIN */

main {
    width: 95%;
    max-width: 1200px;
    margin: 30px auto;
}

/* TIER ROW */

.tier-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    margin-bottom: 8px;
    min-height: 70px;
    border-radius: 7px;
    overflow: hidden;
    background: #11151d;
    border: 1px solid #252c38;
}

.tier-name {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
}

/* TIER COLORS */

.HT1 {
    background: #ff3b3b;
}

.LT1 {
    background: #ff6b6b;
}

.HT2 {
    background: #ff9838;
}

.LT2 {
    background: #ffb45e;
}

.HT3 {
    background: #f4d03f;
    color: #111;
}

.LT3 {
    background: #f7e56b;
    color: #111;
}

.HT4 {
    background: #43c978;
}

.LT4 {
    background: #68dc96;
}

.HT5 {
    background: #4199ed;
}

.LT5 {
    background: #70b4f2;
}

/* PLAYERS */

.players {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
}

.player {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #191f29;
    border: 1px solid #303846;
    border-radius: 7px;
    padding: 8px 10px;
    font-weight: bold;
}

.player-name {
    cursor: pointer;
}

.player-name:hover {
    color: #55ff55;
}

.player button {
    border: none;
    cursor: pointer;
    border-radius: 4px;
    width: 23px;
    height: 23px;
    color: white;
    font-weight: bold;
}

.up {
    background: #2d9d52;
}

.down {
    background: #b33c3c;
}

.delete {
    background: #555;
}

/* ADD PLAYER */

.add-player {
    background: #11151d;
    border: 1px solid #252c38;
    border-radius: 8px;
    padding: 20px;
    margin-top: 25px;
}

.add-player h2 {
    margin-top: 0;
}

input,
select {
    background: #0b0e13;
    color: white;
    border: 1px solid #303846;
    padding: 10px;
    border-radius: 6px;
    margin-right: 8px;
}

.add-btn {
    background: #55ff55;
    color: #071007;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #79ff79;
}

/* PROFILE MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.78);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.profile-card {
    width: 100%;
    max-width: 500px;
    background: #11151d;
    border: 1px solid #303846;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.6);
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 15px;
    background: #292f39;
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
}

.close:hover {
    background: #ff4444;
}

.profile-header {
    text-align: center;
    margin-bottom: 25px;
}

.profile-head {
    width: 100px;
    height: 100px;
    image-rendering: pixelated;
    border-radius: 10px;
    border: 3px solid #55ff55;
    margin-bottom: 12px;
}

.profile-header h2 {
    margin: 5px 0;
    font-size: 28px;
}

.profile-header p {
    color: #8d97a8;
}

.profile-rankings {
    display: grid;
    gap: 8px;
}

.profile-ranking {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #191f29;
    border: 1px solid #303846;
    padding: 12px;
    border-radius: 7px;
}

.profile-mode {
    font-weight: bold;
}

.profile-tier {
    padding: 6px 12px;
    border-radius: 5px;
    font-weight: bold;
}

/* MOBILE */

@media (max-width: 600px) {

    .tier-row {
        grid-template-columns: 75px 1fr;
    }

    .tier-name {
        font-size: 14px;
    }

    input,
    select,
    .add-btn {
        width: 100%;
        margin: 5px 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>ARCH TIERS</h1>
    <p>Minecraft PvP Tier Rankings</p>
</header>

<nav>

    <button
        onclick="changeMode('Bedfight')"
        id="BedfightBtn"
        class="active">
        Bedfight
    </button>

    <button
        onclick="changeMode('Bedwars')"
        id="BedwarsBtn">
        Bedwars
    </button>

    <button
        onclick="changeMode('UHC')"
        id="UHCBtn">
        UHC
    </button>

    <button
        onclick="changeMode('Sumo')"
        id="SumoBtn">
        Sumo
    </button>

</nav>

<main>

    <div id="tierList"></div>

    <div class="add-player">

        <h2>Add Player</h2>

        <input
            id="playerName"
            type="text"
            placeholder="Minecraft username">

        <select id="playerTier">

            <option>HT1</option>
            <option>LT1</option>
            <option>HT2</option>
            <option>LT2</option>
            <option>HT3</option>
            <option>LT3</option>
            <option>HT4</option>
            <option>LT4</option>
            <option>HT5</option>
            <option>LT5</option>

        </select>

        <button
            class="add-btn"
            onclick="addPlayer()">
            Add Player
        </button>

    </div>

</main>


<!-- PROFILE POPUP -->

<div
    class="modal"
    id="profileModal"
    onclick="closeOutside(event)">

    <div class="profile-card">

        <button
            class="close"
            onclick="closeProfile()">
            ×
        </button>

        <div class="profile-header">

            <img
                id="profileHead"
                class="profile-head"
                src=""
                alt="Minecraft Head">

            <h2 id="profileName">
                Player
            </h2>

            <p>
                Arch Tiers Player Profile
            </p>

        </div>

        <div
            class="profile-rankings"
            id="profileRankings">
        </div>

    </div>

</div>


<script>

/*
==================================================
PLAYERS
==================================================
*/

let players = {

    Bedfight: {
        "ExamplePlayer": "HT1",
        "ExamplePlayer2": "LT2"
    },

    Bedwars: {
        "ExamplePlayer": "HT2"
    },

    UHC: {
        "ExamplePlayer": "HT3"
    },

    Sumo: {
        "ExamplePlayer": "LT1"
    }

};


/*
==================================================
TIER ORDER
==================================================
*/

const tiers = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
];

const modes = [
    "Bedfight",
    "Bedwars",
    "UHC",
    "Sumo"
];

let currentMode = "Bedfight";


/*
==================================================
SAVE DATA
==================================================
*/

function saveData() {

    localStorage.setItem(
        "archTiersPlayers",
        JSON.stringify(players)
    );

}


/*
==================================================
LOAD DATA
==================================================
*/

function loadData() {

    const saved =
        localStorage.getItem("archTiersPlayers");

    if (saved) {

        players =
            JSON.parse(saved);

    }

}


/*
==================================================
CHANGE MODE
==================================================
*/

function changeMode(mode) {

    currentMode = mode;

    document
        .querySelectorAll("nav button")
        .forEach(button => {

            button.classList.remove("active");

        });

    document
        .getElementById(mode + "Btn")
        .classList.add("active");

    render();

}


/*
==================================================
DISPLAY TIER LIST
==================================================
*/

function render() {

    const container =
        document.getElementById("tierList");

    container.innerHTML = "";

    tiers.forEach(tier => {

        const row =
            document.createElement("div");

        row.className = "tier-row";

        row.innerHTML = `

            <div class="tier-name ${tier}">
                ${tier}
            </div>

            <div
                class="players"
                id="${tier}">
            </div>

        `;

        container.appendChild(row);

    });


    for (
        const player
        in players[currentMode]
    ) {

        const tier =
            players[currentMode][player];

        const playerBox =
            document.createElement("div");

        playerBox.className = "player";

        playerBox.innerHTML = `

            <span
                class="player-name"
                onclick="openProfile('${player}')">
                ${player}
            </span>

            <button
                class="up"
                onclick="movePlayer('${player}', -1)">
                ↑
            </button>

            <button
                class="down"
                onclick="movePlayer('${player}', 1)">
                ↓
            </button>

            <button
                class="delete"
                onclick="deletePlayer('${player}')">
                ×
            </button>

        `;

        document
            .getElementById(tier)
            .appendChild(playerBox);

    }

}


/*
==================================================
MOVE PLAYER
==================================================
*/

function movePlayer(player, direction) {

    const currentTier =
        players[currentMode][player];

    const currentIndex =
        tiers.indexOf(currentTier);

    let newIndex =
        currentIndex + direction;

    if (newIndex < 0) {
        newIndex = 0;
    }

    if (newIndex >= tiers.length) {
        newIndex = tiers.length - 1;
    }

    players[currentMode][player] =
        tiers[newIndex];

    saveData();

    render();

}


/*
==================================================
DELETE PLAYER
==================================================
*/

function deletePlayer(player) {

    if (
        confirm(
            "Remove " +
            player +
            " from " +
            currentMode +
            "?"
        )
    ) {

        delete players[currentMode][player];

        saveData();

        render();

    }

}


/*
==================================================
ADD PLAYER
==================================================
*/

function addPlayer() {

    const name =
        document
            .getElementById("playerName")
            .value
            .trim();

    const tier =
        document
            .getElementById("playerTier")
            .value;

    if (!name) {

        alert(
            "Enter a Minecraft username."
        );

        return;

    }

    players[currentMode][name] =
        tier;

    document
        .getElementById("playerName")
        .value = "";

    saveData();

    render();

}


/*
==================================================
OPEN PLAYER PROFILE
==================================================
*/

function openProfile(player) {

    document
        .getElementById("profileName")
        .textContent = player;

    /*
    Minecraft skin/head
    */

    document
        .getElementById("profileHead")
        .src =
        "https://mc-heads.net/avatar/" +
        encodeURIComponent(player) +
        "/100";

    const rankings =
        document.getElementById(
            "profileRankings"
        );

    rankings.innerHTML = "";

    modes.forEach(mode => {

        const tier =
            players[mode][player];

        const row =
            document.createElement("div");

        row.className =
            "profile-ranking";

        if (tier) {

            row.innerHTML = `

                <span class="profile-mode">
                    ${mode}
                </span>

                <span
                    class="profile-tier ${tier}">
                    ${tier}
                </span>

            `;

        } else {

            row.innerHTML = `

                <span class="profile-mode">
                    ${mode}
                </span>

                <span
                    style="
                    color:#737d8c;
                    font-weight:bold;">
                    Unranked
                </span>

            `;

        }

        rankings.appendChild(row);

    });

    document
        .getElementById("profileModal")
        .classList.add("active");

}


/*
==================================================
CLOSE PROFILE
==================================================
*/

function closeProfile() {

    document
        .getElementById("profileModal")
        .classList.remove("active");

}


function closeOutside(event) {

    if (
        event.target.id ===
        "profileModal"
    ) {

        closeProfile();

    }

}


/*
==================================================
START
==================================================
*/

loadData();

render();

</script>

</body>
</html>
